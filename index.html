<title>EcoTrack · Cassandra façon Duolingo</title>
<style>
:root{--bg:#fff;--fg:#2b3a42;--mut:#7b8a93;--bd:#e5e9ec;--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--rd:#d93a3a;--b:#1cb0f6;--bd2:#1491c9;--o:#ff9600;--od:#d97e00;--gb:#e1f7cb;--rb:#ffe3e3;--card:#f4f7f8;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#e8eef0;--mut:#8fa0a8;--bd:#2c3b43;--gb:#1d3a14;--rb:#40201f;--card:#1b282f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
.ic{flex:none;vertical-align:middle}.ic.f{fill:currentColor}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;padding:12px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--bd)}
.c{display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:900}
.ttl{padding:22px 20px 4px}.ttl h1{margin:0;font-size:26px;font-weight:900}.ttl p{color:var(--mut);margin:4px 0 0}
.hero{margin:16px 20px 0;padding:18px;border-radius:20px;background:linear-gradient(135deg,#58cc02,#3fa800);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 5px 0 var(--gd)}
.hero small{opacity:.85;font-size:12px;letter-spacing:.6px;text-transform:uppercase;display:block}.hero b{display:block;font-size:19px;margin:2px 0 8px}
.hero button{background:#fff;color:var(--gd);border:0;border-radius:14px;padding:12px 16px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;box-shadow:0 4px 0 #d6e8c8}
.gp{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin:2px 0 6px;min-width:140px}.gp i{display:block;height:100%;background:#fff;border-radius:6px}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 0 36px}
.w{display:flex;flex-direction:column;align-items:center;position:relative}
.node{width:80px;height:80px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:var(--g);box-shadow:0 7px 0 var(--gd);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gd)}
.node.lock{background:var(--bd);box-shadow:0 7px 0 #c9d0d4;color:var(--mut);cursor:not-allowed}
.node.done{background:#ffc800;box-shadow:0 7px 0 #d9a900}
.node.cur{background:var(--b);box-shadow:0 7px 0 var(--bd2),0 0 0 8px rgba(28,176,246,.18);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 7px 0 var(--bd2),0 0 0 14px rgba(28,176,246,.08)}}
.go{position:absolute;top:-30px;background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:900;color:var(--b);text-transform:uppercase;letter-spacing:.5px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.lbl{font-size:13px;color:var(--mut);margin-top:10px;text-align:center;max-width:140px}
.acts{padding:0 20px 44px;display:flex;flex-direction:column;gap:12px}
.act{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;background:var(--bg);font-weight:900;letter-spacing:.4px;text-transform:uppercase;font-size:14px}
.act.b{background:var(--b);border-color:var(--bd2);color:#fff}.act.o{background:var(--o);border-color:var(--od);color:#fff}.act:disabled{opacity:.45;cursor:not-allowed}
.act.q{border:0;color:var(--mut);text-transform:none;font-weight:700;font-size:13px}
.badge{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:13px}
.top{display:flex;align-items:center;gap:14px;padding:16px 18px}
.x{background:none;border:0;color:var(--mut);display:grid;place-items:center;padding:4px}
.bar{flex:1;height:16px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .35s;box-shadow:inset 0 4px 0 rgba(255,255,255,.25)}
.hearts{display:flex;align-items:center;gap:5px;color:var(--r);font-weight:900;font-size:17px}
main{flex:1;padding:6px 22px 24px}
#app.fresh main{animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h2{font-size:23px;line-height:1.3;margin:10px 0 22px;font-weight:900}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-bottom:12px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;background:var(--bg);font-size:16px}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--b);background:rgba(28,176,246,.12);color:var(--b)}
.opt.ok{border-color:var(--g);background:var(--gb)}.opt.no{border-color:var(--r);background:var(--rb);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ans{min-height:112px;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 48px,var(--bd) 48px 50px)}
.ans.no{animation:shake .4s}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.chip{padding:9px 12px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:12px;background:var(--bg);font-family:var(--mono);font-size:13px}
.chip:active{transform:translateY(2px)}
@keyframes pop{from{transform:scale(.9)}}
.chip.used{background:var(--card);color:transparent;border-color:var(--card);cursor:default;animation:none}
.foot{padding:16px 22px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--bd);position:sticky;bottom:0;background:var(--bg)}
.foot.ok,.foot.bad{border-color:transparent}
#app.fb .foot.ok,#app.fb .foot.bad{animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.foot.ok{background:var(--gb)}.foot.bad{background:var(--rb)}
.fb{margin-bottom:14px;font-size:15px;line-height:1.45}.fb b{display:flex;align-items:center;gap:8px;font-size:20px;margin-bottom:4px}
.foot.ok .fb{color:var(--gd)}.foot.bad .fb{color:var(--rd)}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--g);color:#fff;font-size:16px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 4px 0 var(--gd)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn:disabled{background:var(--bd);color:var(--mut);box-shadow:0 4px 0 #c9d0d4;cursor:not-allowed}
.foot.bad .btn{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.end{text-align:center;padding:56px 22px}.end .big{display:grid;place-items:center;width:112px;height:112px;margin:0 auto 18px;border-radius:50%;background:var(--card)}
.end h2{font-size:28px;margin:6px 0}.end p{color:var(--mut)}
.stats{display:flex;gap:14px;justify-content:center;margin:24px 0}
.stat{border:2px solid var(--bd);border-radius:16px;padding:12px 22px;font-size:22px;font-weight:900;min-width:96px}
.stat small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
textarea{width:100%;min-height:120px;padding:12px;border:2px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);font:14px/1.5 var(--mono);resize:vertical;outline:0}
textarea:focus{border-color:var(--b)}textarea.ok{border-color:var(--g);background:var(--gb)}textarea.no{border-color:var(--r);background:var(--rb);animation:shake .4s}
.hint{display:inline-flex;align-items:center;gap:6px;color:var(--b);margin-top:12px;background:none;border:0;font-size:14px;font-weight:900}
.sm{display:block;width:100%;margin-top:12px;padding:12px;border:2px solid var(--bd);border-radius:14px;background:none;color:var(--mut);font-size:14px}
.sp{border:2px solid var(--bd);border-radius:16px;background:var(--card);margin:0 0 18px;overflow:hidden}
.spt{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;background:none;border:0;font-weight:900;font-size:14px;color:var(--b);text-align:left}
.spb{padding:0 14px 12px;font-size:14px;line-height:1.55}.spb ul{margin:4px 0 8px;padding-left:20px}.spb li{margin-bottom:3px}.spb b{font-weight:900}
.chip{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.chip.float{position:fixed;z-index:60;margin:0;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:scale(1.06) rotate(-2deg);opacity:.97;animation:none}
.ans .chip.drag-src{display:none}.bank .chip.drag-src{opacity:.3}
.slot{flex:none;width:4px;height:40px;margin:0 2px;border-radius:3px;background:var(--b);align-self:flex-start}
.ans.over{background-color:rgba(28,176,246,.07)}
.dh{color:var(--mut);font-size:13px;text-align:center;margin-top:16px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
code{font-family:var(--mono);font-size:.9em;background:var(--card);padding:1px 6px;border-radius:6px;word-break:break-word}
.foot code{background:rgba(0,0,0,.07)}
</style>
</head>

var L=[
{n:"Keyspace",ic:"database",ex:[
{q:"Quelle stratégie de réplication pour un keyspace de TP sur un seul nœud ?",o:["SimpleStrategy","NetworkTopologyStrategy","LocalStrategy","RandomStrategy"],a:0,e:"SimpleStrategy suffit pour un seul datacenter (ici replication_factor = 1)."},
{q:"Étape 1 : crée le keyspace EcoTrack avec une réplication simple.",b:["CREATE","KEYSPACE","IF NOT EXISTS","EcoTrack","WITH REPLICATION","=","{","'class':","'SimpleStrategy',","'replication_factor':","1","}",";"],x:["TABLE","DATABASE"],e:"Un keyspace est l’équivalent d’une base de données : il porte la stratégie de réplication."},

{q:"À quoi sert la clustering key date_heure ?",o:["Ordonner les lignes à l’intérieur d’une partition","Répartir les données sur les nœuds","Chiffrer les données","Créer un index secondaire"],a:0,e:"La clustering key trie physiquement les lignes d’une partition (ordre temporel)."},
{q:"Étape 2 : crée la table mesures (colonnes dans l’ordre de l’énoncé).",b:["CREATE TABLE","IF NOT EXISTS","mesures","(","station_id TEXT,","date_heure TIMESTAMP,","pm25 DOUBLE,","ozone DOUBLE,","co2 DOUBLE,","temperature DOUBLE,","bruit DOUBLE,","alertes SET<TEXT>,","capteurs LIST<TEXT>,","meta MAP<TEXT, TEXT>,","PRIMARY KEY ((station_id), date_heure)",");"],x:["alertes LIST<TEXT>,","pm25 TEXT,","PRIMARY KEY (date_heure)"],e:"Les doubles parenthèses isolent la partition key ; le reste est le clustering."},
{q:"Quels types pour alertes (sans doublon) et capteurs (liste ordonnée) ?",o:["SET<TEXT> et LIST<TEXT>","LIST<TEXT> et SET<TEXT>","TEXT et TEXT","MAP<TEXT,TEXT> et SET<TEXT>"],a:0,e:"SET = sans doublon ni ordre ; LIST = ordonnée ; MAP = clé → valeur."}]},
{n:"Stations & events",ic:"server",ex:[

{q:"Crée la table stations.",b:["CREATE TABLE","IF NOT EXISTS","stations","(","station_id TEXT,","ville TEXT,","latitude DOUBLE,","longitude DOUBLE,","meta MAP<TEXT, TEXT>,","PRIMARY KEY (station_id)",");"],x:["PRIMARY KEY ((station_id), ville)","meta SET<TEXT>,"],e:"Une MAP rend les informations extensibles."},

{q:"Crée la table events.",b:["CREATE TABLE","IF NOT EXISTS","events","(","station_id TEXT,","horodatage_event TIMESTAMP,","type_event TEXT,","tags SET<TEXT>,","PRIMARY KEY ((station_id), horodatage_event)",");"],x:["tags LIST<TEXT>,","type_event SET<TEXT>,"],e:"type_event est du texte, tags est un SET."},

function spCard(ex){var sp=ex.o?null:L[parseInt(ex.id)].sp;if(!sp)return "";return '<div class="sp"><button class="spt" onclick="S.spHide=!S.spHide;show()">'+I("file",16)+'<span style="flex:1">Énoncé du TP</span>'+I(S.spHide?"chev":"chevu",18)+'</button>'+(S.spHide?"":'<div class="spb">'+sp+'</div>')+'</div>'}
function chip(id){var b=S.bank.filter(function(x){return x.id==id})[0];return '<button class="chip" data-id="'+id+'" onclick="pick('+id+')">'+esc(b.t)+'</button>'}
var SUP=false;
function pick(i){if(SUP||S.st!="ask")return;var ex=cur();
if(ex.o)S.sel=i;else{var k=S.placed.indexOf(i);if(k>=0)S.placed.splice(k,1);else S.placed.push(i)}
show()}
function check(){var ex=cur(),g;
if(ex.o)g=S.sel==ex.a;
else if(ex.t)g=[].concat(ex.t).some(function(t){var w=t.match(/^(.*\sWHERE\s)(.*?)\s+AND\s+(.*?)(;?)$/i);return nz(t)===nz(S.txt)||(w&&nz(w[1]+w[3]+" AND "+w[2]+w[4])===nz(S.txt))});
else g=S.placed.map(function(id){return S.bank.filter(function(x){return x.id==id})[0].t}).join(" ")===ex.b.join(" ");
S.good=g;S.st="done";
if(g){S.ok++;S.xp+=ex.t?15:10;delete P.wr[ex.id]}else{S.hearts--;P.wr[ex.id]=1;if(S.exam)S.miss.push(ex.q);else S.q.push(S.q[S.pos])}
save();S.fbk=true;show()}
function next(){
if(!S.exam&&!S.good&&S.hearts<=0){A.innerHTML='<div class="end"><div class="big" style="color:var(--r)">'+I("heartx",56)+'</div><h2>Plus de cœurs !</h2><p>Relis les explications et réessaie.</p><button class="btn" onclick="start('+S.li+')">Recommencer</button><button class="sm" onclick="home()">Retour</button></div>';return}
S.pos++;S.sel=null;S.placed=[];S.bank=null;S.st="ask";S.txt="";S.hint=false;S.fresh=true;show()}
function finish(){
if(S.exam){var sc=Math.round(S.ok/S.total*200)/10,rec=false;if(!S.rev){rec=sc>(P.best||0);P.best=Math.max(P.best||0,sc)}save();
A.innerHTML='<div class="end"><div class="big" style="color:'+(sc>=18?"#e6b400":sc>=14?"var(--g)":"var(--o)")+'">'+I(sc>=18?"trophy":sc>=14?"award":"trend",56)+'</div><h2>'+(S.rev?S.ok+" / "+S.total+" corrigées":"Note : "+sc+" / 20")+'</h2><p>'+(S.rev?"Les questions réussies sortent de ta liste d’erreurs.":rec?"Nouveau record !":"Record : "+P.best+" / 20")+'</p>'+(S.miss.length?'<div style="text-align:left;margin:16px 0"><b>À revoir :</b><ul>'+S.miss.map(function(m){return '<li>'+esc(m)+'</li>'}).join("")+'</ul></div>':"")+'<button class="btn" onclick="exam('+(S.rev&&nWr()?1:"")+')">'+(S.rev?"Continuer la révision":"Refaire un examen")+'</button><button class="sm" onclick="home()">Retour</button></div>';return}
var td=new Date().toDateString();if(P.last!=td){var y=new Date(Date.now()-864e5).toDateString();P.streak=P.last==y?P.streak+1:1;P.last=td}
P.done[S.li]=true;P.xp+=S.xp;save();
var last=allDone();
A.innerHTML='<div class="end"><div class="big" style="color:#e6b400">'+I(last?"trophy":"award",56)+'</div><h2>'+(last?"TP terminé !":"Leçon terminée !")+'</h2><p>'+esc(L[S.li].n)+' : validée.</p><div class="stats"><div class="stat"><small>XP</small>+'+S.xp+'</div><div class="stat"><small>Cœurs</small>'+S.hearts+'/5</div></div><button class="btn" onclick="home()">Continuer</button></div>'}
/* Drag & drop (Pointer Events : souris, tactile, stylet) */
var DR=null;
function chipAt(e){var c=e.target.closest&&e.target.closest(".chip[data-id]");return c&&!c.classList.contains("used")&&!c.classList.contains("float")&&S&&S.st=="ask"&&S.bank&&A.contains(c)?c:null}
function drStop(){if(!DR)return;clearTimeout(DR.t);if(DR.clone)DR.clone.remove();if(DR.slot)DR.slot.remove();DR.el.classList.remove("drag-src");var a=A.querySelector(".ans");if(a)a.classList.remove("over");DR=null}
function drBegin(){if(!DR||DR.on)return;DR.on=true;var r=DR.el.getBoundingClientRect();DR.dx=DR.x-r.left;DR.dy=DR.y-r.top;var c=DR.el.cloneNode(true);c.removeAttribute("onclick");c.classList.add("float");c.style.width=r.width+"px";document.body.appendChild(c);DR.clone=c;DR.slot=document.createElement("span");DR.slot.className="slot";DR.el.classList.add("drag-src");if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}drMove()}
function drMove(){var c=DR.clone;c.style.left=(DR.x-DR.dx)+"px";c.style.top=(DR.y-DR.dy)+"px";
var a=A.querySelector(".ans");if(!a)return;var r=a.getBoundingClientRect(),x=DR.x,y=DR.y;
DR.inside=x>=r.left-10&&x<=r.right+10&&y>=r.top-14&&y<=r.bottom+14;a.classList.toggle("over",DR.inside);
if(!DR.inside){DR.slot.remove();return}
var chips=[].slice.call(a.querySelectorAll(".chip[data-id]")).filter(function(k){return k!==DR.el}),idx=0;
chips.forEach(function(k){var q=k.getBoundingClientRect();if(y>q.bottom||(y>=q.top&&x>q.left+q.width/2))idx++});
DR.idx=idx;var ref=chips[idx]||null;if(DR.slot.nextSibling!==ref||DR.slot.parentNode!==a)a.insertBefore(DR.slot,ref)}
function drDrop(){var d=DR;if(!d||!d.on){drStop();return}
var pl=S.placed.filter(function(i){return i!==d.id}),changed=false;
if(d.inside){pl.splice(d.idx,0,d.id);changed=true}else if(d.from=="ans"){changed=true}
drStop();SUP=true;setTimeout(function(){SUP=false},0);
if(changed&&S.st=="ask"){S.placed=pl;S.fid=null;show()}}
document.addEventListener("pointerdown",function(e){if(DR||(e.pointerType=="mouse"&&e.button!==0))return;var c=chipAt(e);if(!c)return;
DR={el:c,id:+c.dataset.id,pid:e.pointerId,type:e.pointerType,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,from:c.parentNode.classList.contains("ans")?"ans":"bank",on:false};
if(e.pointerType!=="mouse")DR.t=setTimeout(drBegin,170)});
document.addEventListener("pointermove",function(e){if(!DR||e.pointerId!==DR.pid)return;DR.x=e.clientX;DR.y=e.clientY;
if(DR.on){drMove();return}
var d=Math.hypot(DR.x-DR.x0,DR.y-DR.y0);if(DR.type==="mouse"){if(d>5)drBegin()}else if(d>10){drStop()}});
document.addEventListener("pointerup",function(e){if(DR&&e.pointerId===DR.pid)drDrop()});
document.addEventListener("pointercancel",function(e){if(DR&&e.pointerId===DR.pid)drStop()});
document.addEventListener("touchmove",function(e){if(DR&&DR.on)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",function(e){if(DR)e.preventDefault()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&DR)drStop()});
A.addEventListener("keydown",function(e){var c=e.target.closest&&e.target.closest(".ans .chip[data-id]");if(!c||!S||S.st!="ask")return;var id=+c.dataset.id,k=S.placed.indexOf(id),d=e.key=="ArrowLeft"?-1:e.key=="ArrowRight"?1:0;
if(d){var j=k+d;if(j<0||j>=S.placed.length)return;e.preventDefault();S.placed.splice(k,1);S.placed.splice(j,0,id);S.fid=id;show()}
else if(e.key=="Backspace"||e.key=="Delete"){e.preventDefault();S.placed.splice(k,1);show()}});
document.addEventListener("keydown",function(e){if(e.key!="Enter"||!S||e.target.tagName=="BUTTON")return;if(e.target.tagName=="TEXTAREA"&&!(e.ctrlKey||e.metaKey))return;var b=document.querySelector(".foot .btn");if(b&&!b.disabled){e.preventDefault();b.click()}});
home();cloud();
</script>
